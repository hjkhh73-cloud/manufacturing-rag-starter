name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Build sample knowledge base
        run: python -m mfg_rag_starter build --input data/sample_knowledge.csv --output examples/manufacturing_kb.jsonl
      - name: Preview sample knowledge base
        run: python -m mfg_rag_starter preview --input examples/manufacturing_kb.jsonl --limit 1
      - name: Run manufacturing retrieval baseline
        run: python -m mfg_rag_starter evaluate --knowledge examples/manufacturing_kb.jsonl --questions evaluation/manufacturing_eval_questions.jsonl --output evaluation/baseline_results.json --top-k 1
